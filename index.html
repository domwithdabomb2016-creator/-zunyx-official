<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZUNYX</title>
<style>
body{
margin:0;
font-family:Arial;
background:#f4f4f4;
color:#111;
}
header{
background:#000;
color:white;
padding:20px;
display:flex;
justify-content:space-between;
align-items:center;
}
.logo{
font-size:28px;
font-weight:bold;
letter-spacing:5px;
}
button{
cursor:pointer;
}
.cart{
background:white;
border:0;
padding:10px 18px;
border-radius:20px;
font-weight:bold;
}
.hero{
background:#000;
color:white;
text-align:center;
padding:90px 20px;
}
.hero h1{
font-size:70px;
margin:0;
letter-spacing:8px;
}
.hero p{
color:#aaa;
letter-spacing:3px;
}
.shop{
max-width:1000px;
margin:auto;
padding:60px 20px;
}
.shop h2{
text-align:center;
font-size:40px;
}
.products{
display:grid;
grid-template-columns:1fr 1fr;
gap:25px;
}
.product{
background:white;
border-radius:15px;
overflow:hidden;
}
.product img{
width:100%;
height:450px;
object-fit:cover;
}
.info{
padding:20px;
}
.name{
font-size:22px;
font-weight:bold;
}
.price{
font-size:18px;
margin:10px 0 20px;
}
.add{
width:100%;
padding:14px;
background:#000;
color:white;
border:0;
border-radius:8px;
font-weight:bold;
}
.about{
background:#000;
color:white;
text-align:center;
padding:70px 20px;
}
.about p{
max-width:600px;
margin:auto;
line-height:1.6;
color:#aaa;
}
footer{
background:#000;
color:#777;
text-align:center;
padding:25px;
}
#cartBox{
display:none;
position:fixed;
right:0;
top:0;
width:350px;
max-width:100%;
height:100%;
background:white;
padding:25px;
z-index:100;
box-shadow:-5px 0 20px #0005;
}
.close{
float:right;
border:0;
border-radius:50%;
padding:8px 12px;
}
.item{
padding:15px 0;
border-bottom:1px solid #ddd;
display:flex;
justify-content:space-between;
}
.total{
font-size:22px;
font-weight:bold;
margin-top:25px;
}
.checkout{
width:100%;
padding:15px;
margin-top:20px;
background:#000;
color:white;
border:0;
border-radius:8px;
font-weight:bold;
}
@media(max-width:700px){
.products{
grid-template-columns:1fr;
}
.hero h1{
font-size:50px;
}
}
</style>
</head>
<body>
<header>
<div class="logo">ZUNYX</div>
<button class="cart" onclick="openCart()">
CART (<span id="count">0</span>)
</button>
</header>
<section class="hero">
<h1>ZUNYX</h1>
<p>MOVE DIFFERENT.</p>
</section>
<section class="shop">
<h2>SHOP</h2>
<div class="products">
<div class="product">
<img src="product1.jpg">
<div class="info">
<div class="name">
ZUNYX HOODIE
</div>
<div class="price">
£34.99
</div>
<button class="add"
onclick="add('ZUNYX Hoodie',34.99)">
ADD TO CART
</button>
</div>
</div>
<div class="product">
<img src="product2.jpg">
<div class="info">
<div class="name">
ZUNYX PERFORMANCE
</div>
<div class="price">
£55.00
</div>
<button class="add"
onclick="add('ZUNYX Performance',55)">
ADD TO CART
</button>
</div>
</div>
</div>
</section>
<section class="about">
<h2>ABOUT ZUNYX</h2>
<p>
ZUNYX is built different.
Sportswear for people who move different.
</p>
</section>
<footer>
© 2026 ZUNYX
</footer>
<div id="cartBox">
<button class="close" onclick="closeCart()">×</button>
<h2>YOUR CART</h2>
<div id="items">
Your cart is empty.
</div>
<div class="total">
TOTAL: £<span id="total">0.00</span>
</div>
<button class="checkout" onclick="checkout()">
CHECKOUT
</button>
</div>
<script>
let cart=[];
function add(name,price){
cart.push({
name:name,
price:price
});
updateCart();
openCart();
}
function remove(i){
cart.splice(i,1);
updateCart();
}
function updateCart(){
document.getElementById("count").innerText=cart.length;
let box=document.getElementById("items");
let total=0;
box.innerHTML="";
if(cart.length===0){
box.innerHTML="Your cart is empty.";
}else{
cart.forEach(function(item,i){
total+=item.price;
box.innerHTML+=`
<div class="item">
<span>
<b>${item.name}</b><br>
£${item.price.toFixed(2)}
</span>
<button onclick="remove(${i})">
REMOVE
</button>
</div>
`;
});
}
document.getElementById("total").innerText=
total.toFixed(2);
}
function openCart(){
document.getElementById("cartBox").style.display="block";
}
function closeCart(){
document.getElementById("cartBox").style.display="none";
}
function checkout(){
if(cart.length===0){
alert("Your cart is empty!");
}else{
alert("Checkout coming soon!");
}
}
</script>
</body>
</html>
