<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ZUNYX — MOVE DIFFERENT</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html{
scroll-behavior:smooth;
}

body{
font-family:Arial,Helvetica,sans-serif;
background:#f4f4f4;
color:#111;
}

/* HEADER */

header{
position:sticky;
top:0;
z-index:50;

height:70px;

background:#000;
color:#fff;

display:flex;
align-items:center;
justify-content:space-between;

padding:0 25px;

border-bottom:1px solid #222;
}

.logo{
font-size:27px;
font-weight:900;
letter-spacing:6px;
}

.cart-btn{
border:none;
background:#fff;
color:#000;

padding:11px 18px;

border-radius:30px;

font-size:13px;
font-weight:bold;

cursor:pointer;

transition:.2s;
}

.cart-btn:hover{
transform:scale(1.05);
}

/* HERO */

.hero{
background:#000;
color:#fff;

min-height:520px;

display:flex;
align-items:center;
justify-content:center;

text-align:center;

padding:60px 20px;
}

.hero-content{
max-width:900px;
}

.hero h1{
font-size:clamp(55px,12vw,125px);
font-weight:900;

letter-spacing:12px;

line-height:.9;
}

.hero p{
margin-top:28px;

font-size:15px;

letter-spacing:6px;

color:#999;
}

.hero-btn{
display:inline-block;

margin-top:35px;

padding:15px 30px;

background:#fff;
color:#000;

border-radius:30px;

text-decoration:none;

font-weight:bold;

transition:.2s;
}

.hero-btn:hover{
transform:translateY(-3px);
}

/* SHOP */

.shop{
max-width:1150px;

margin:auto;

padding:80px 20px;
}

.section-title{
text-align:center;

font-size:42px;

font-weight:900;

letter-spacing:2px;

margin-bottom:45px;
}

.products{
display:grid;

grid-template-columns:1fr 1fr;

gap:30px;
}

/* PRODUCT */

.product{
background:#fff;

border-radius:18px;

overflow:hidden;

border:1px solid #ddd;

transition:.25s;
}

.product:hover{
transform:translateY(-6px);

box-shadow:0 15px 40px rgba(0,0,0,.12);
}

/* IMPORTANT:
   FULL IMAGE IS SHOWN
   NO CROPPING
*/

.product-image{
width:100%;

height:auto;

display:block;

object-fit:contain;

background:#eee;
}

.product-info{
padding:24px;
}

.product-tag{
font-size:11px;

font-weight:bold;

letter-spacing:2px;

color:#888;

margin-bottom:8px;
}

.product-name{
font-size:24px;

font-weight:900;
}

.product-price{
font-size:19px;

font-weight:bold;

margin-top:10px;

margin-bottom:20px;
}

.add-btn{
width:100%;

padding:16px;

border:0;

border-radius:9px;

background:#000;

color:#fff;

font-size:14px;

font-weight:bold;

cursor:pointer;

transition:.2s;
}

.add-btn:hover{
background:#333;

transform:translateY(-2px);
}

/* ABOUT */

.about{
background:#000;

color:#fff;

text-align:center;

padding:90px 20px;
}

.about h2{
font-size:40px;

font-weight:900;

margin-bottom:22px;
}

.about p{
max-width:650px;

margin:auto;

line-height:1.8;

color:#999;

font-size:16px;
}

/* FOOTER */

footer{
background:#000;

color:#666;

text-align:center;

padding:30px;

font-size:12px;

letter-spacing:2px;
}

/* CART */

.cart-overlay{
display:none;

position:fixed;

inset:0;

background:rgba(0,0,0,.55);

z-index:90;
}

.cart{
position:fixed;

top:0;
right:-420px;

width:400px;

max-width:100%;

height:100%;

background:#fff;

z-index:100;

padding:25px;

box-shadow:-10px 0 40px rgba(0,0,0,.2);

transition:.3s;

overflow-y:auto;
}

.cart.open{
right:0;
}

.cart-overlay.open{
display:block;
}

.cart-top{
display:flex;

align-items:center;

justify-content:space-between;

padding-bottom:20px;

border-bottom:1px solid #ddd;
}

.cart-top h2{
font-size:27px;
}

.close{
width:38px;
height:38px;

border:0;

border-radius:50%;

background:#eee;

font-size:22px;

cursor:pointer;
}

.cart-items{
padding-top:10px;
}

.cart-item{
display:flex;

align-items:center;

justify-content:space-between;

gap:15px;

padding:18px 0;

border-bottom:1px solid #ddd;
}

.cart-item-name{
font-weight:bold;

font-size:15px;
}

.cart-item-price{
font-size:14px;

margin-top:5px;

color:#555;
}

.remove{
border:0;

background:#eee;

padding:8px 10px;

border-radius:7px;

font-size:11px;

font-weight:bold;

cursor:pointer;
}

.empty{
color:#888;

padding:30px 0;

text-align:center;
}

.cart-bottom{
margin-top:25px;
}

.total{
display:flex;

justify-content:space-between;

font-size:21px;

font-weight:900;
}

.checkout{
width:100%;

padding:17px;

margin-top:20px;

border:0;

border-radius:9px;

background:#000;

color:#fff;

font-weight:bold;

cursor:pointer;
}

/* MOBILE */

@media(max-width:700px){

header{
padding:0 16px;
}

.logo{
font-size:23px;

letter-spacing:4px;
}

.cart-btn{
padding:10px 14px;
}

.hero{
min-height:470px;
}

.hero h1{
letter-spacing:6px;
}

.hero p{
letter-spacing:3px;
}

.products{
grid-template-columns:1fr;
}

.shop{
padding:60px 15px;
}

.section-title{
font-size:34px;
}

.about h2{
font-size:32px;
}

.cart{
width:100%;
}

}

</style>

</head>


<body>


<!-- HEADER -->

<header>

<div class="logo">
ZUNYX
</div>

<button class="cart-btn" onclick="openCart()">
CART (<span id="cartCount">0</span>)
</button>

</header>


<!-- HERO -->

<section class="hero">

<div class="hero-content">

<h1>ZUNYX</h1>

<p>
MOVE DIFFERENT.
</p>

<a href="#shop" class="hero-btn">
SHOP NOW
</a>

</div>

</section>


<!-- SHOP -->

<section class="shop" id="shop">

<h2 class="section-title">
SHOP
</h2>


<div class="products">


<!-- HOODIE -->

<div class="product">

<img
src="product1.jpg"
alt="ZUNYX Hoodie"
class="product-image"
>

<div class="product-info">

<div class="product-tag">
ZUNYX ESSENTIALS
</div>

<div class="product-name">
ZUNYX HOODIE
</div>

<div class="product-price">
£34.99
</div>

<button
class="add-btn"
onclick="addToCart('ZUNYX Hoodie',34.99)"
>
ADD TO CART
</button>

</div>

</div>


<!-- CAP -->

<div class="product">

<img
src="product2.jpg"
alt="ZUNYX Cap"
class="product-image"
>

<div class="product-info">

<div class="product-tag">
ZUNYX ACCESSORIES
</div>

<div class="product-name">
ZUNYX CAP
</div>

<div class="product-price">
£24.99
</div>

<button
class="add-btn"
onclick="addToCart('ZUNYX Cap',24.99)"
>
ADD TO CART
</button>

</div>

</div>


</div>

</section>


<!-- ABOUT -->

<section class="about">

<h2>
MOVE DIFFERENT.
</h2>

<p>
ZUNYX is made for people who refuse to blend in.
Clean designs. Strong energy. Built for movement.
</p>

</section>


<!-- FOOTER -->

<footer>

© 2026 ZUNYX

</footer>


<!-- OVERLAY -->

<div
id="cartOverlay"
class="cart-overlay"
onclick="closeCart()"
></div>


<!-- CART -->

<div id="cart" class="cart">

<div class="cart-top">

<h2>
YOUR CART
</h2>

<button
class="close"
onclick="closeCart()"
>
×
</button>

</div>


<div
id="cartItems"
class="cart-items"
>

<div class="empty">
Your cart is empty.
</div>

</div>


<div class="cart-bottom">

<div class="total">

<span>
TOTAL
</span>

<span>
£<span id="cartTotal">0.00</span>
</span>

</div>


<button
class="checkout"
onclick="checkout()"
>
CHECKOUT
</button>

</div>

</div>


<script>

let cart = [];


/* ADD TO CART */

function addToCart(name, price){

cart.push({
name:name,
price:price
});

updateCart();

openCart();

}


/* REMOVE */

function removeFromCart(index){

cart.splice(index,1);

updateCart();

}


/* UPDATE CART */

function updateCart(){

document.getElementById("cartCount").textContent = cart.length;

const items = document.getElementById("cartItems");

const totalElement = document.getElementById("cartTotal");

let total = 0;


if(cart.length === 0){

items.innerHTML = `
<div class="empty">
Your cart is empty.
</div>
`;

totalElement.textContent = "0.00";

return;

}


items.innerHTML = "";


cart.forEach(function(item,index){

total += item.price;

items.innerHTML += `

<div class="cart-item">

<div>

<div class="cart-item-name">
${item.name}
</div>

<div class="cart-item-price">
£${item.price.toFixed(2)}
</div>

</div>

<button
class="remove"
onclick="removeFromCart(${index})"
>
REMOVE
</button>

</div>

`;

});


totalElement.textContent = total.toFixed(2);

}


/* OPEN CART */

function openCart(){

document.getElementById("cart").classList.add("open");

document.getElementById("cartOverlay").classList.add("open");

}


/* CLOSE CART */

function closeCart(){

document.getElementById("cart").classList.remove("open");

document.getElementById("cartOverlay").classList.remove("open");

}


/* CHECKOUT */

function checkout(){

if(cart.length === 0){

alert("Your cart is empty!");

return;

}

alert(
"Thanks for shopping with ZUNYX! Checkout will be connected soon."
);

}

</script>


</body>

</html>
