<!DOCTYPE html>
<html>
<head>
<title>ZUNYX OFFICIAL</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{margin:0;background:#090909;color:white;font-family:Arial;text-align:center}
header{padding:25px;border-bottom:1px solid #333}
h1{font-size:55px;font-style:italic;margin:10px}
p{color:#aaa}
button{padding:15px 25px;border:0;background:white;color:black;font-weight:bold;cursor:pointer}
.hero{padding:100px 20px}
.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;padding:30px}
.card{background:#151515;padding:25px}
.shirt{height:220px;background:linear-gradient(#222,#050505);margin-bottom:20px}
.cart{position:fixed;right:20px;top:20px;background:white;color:black;padding:12px}
</style>
</head>
<body>

<div class="cart">🛍 BAG: <span id="count">0</span></div>

<header>
<h1>ZUNYX</h1>
<p>OFFICIAL • MADE FOR MORE.</p>
</header>

<section class="hero">
<p>ZUNYX OFFICIAL</p>
<h1>MADE FOR MORE.</h1>
<p>Performance wear built for those who demand more.</p>
<button onclick="shop()">SHOP DROP 001</button>
</section>

<h2>DROP 001</h2>

<div class="products">

<div class="card">
<div class="shirt"></div>
<h3>ZUNYX PERFORMANCE HOODIE</h3>
<p>£59.99</p>
<button onclick="add()">ADD TO BAG</button>
</div>

<div class="card">
<div class="shirt"></div>
<h3>ZUNYX PERFORMANCE JOGGERS</h3>
<p>£49.99</p>
<button onclick="add()">ADD TO BAG</button>
</div>

<div class="card">
<div class="shirt"></div>
<h3>ZUNYX ACTIVE TEE</h3>
<p>£29.99</p>
<button onclick="add()">ADD TO BAG</button>
</div>

</div>

<footer style="padding:50px">
ZUNYX OFFICIAL<br>
MADE FOR MORE.
</footer>

<script>
let count=0;
function add(){
count++;
document.getElementById("count").textContent=count;
alert("Added to your ZUNYX bag!");
}
function shop(){
document.querySelector(".products").scrollIntoView({behavior:"smooth"});
}
</script>

</body>
</html>
