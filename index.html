<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZUNYX ALPHA</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
height:100vh;
background:#000;
color:#fff;
font-family:Arial,Helvetica,sans-serif;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
overflow:hidden;
}

.box{
padding:40px;
}

.logo{
font-size:clamp(70px,18vw,180px);
font-weight:1000;
letter-spacing:15px;
line-height:.8;
}

.tag{
margin-top:40px;
font-size:18px;
letter-spacing:10px;
font-weight:bold;
}

.status{
margin-top:35px;
font-size:10px;
letter-spacing:4px;
color:#555;
}

.circle{
position:fixed;
width:500px;
height:500px;
border-radius:50%;
background:white;
opacity:.04;
filter:blur(100px);
z-index:-1;
}
</style>
</head>

<body>

<div class="circle"></div>

<div class="box">

<div class="logo">
ZUNYX
</div>

<div class="tag">
MADE FOR MORE.
</div>

<div class="status">
ALPHA VERSION • 2026
</div>

</div>

</body>
</html>
