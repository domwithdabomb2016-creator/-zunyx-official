<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZUNYX Store</title>
<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#f7f7f7;
color:#111;
}
header{
background:#111;
color:white;
padding:22px;
display:flex;
justify-content:space-between;
align-items:center;
}
.logo{
font-size:30px;
font-weight:900;
letter-spacing:5px;
}
.cart{
background:white;
color:#111;
border:0;
padding:12px 20px;
border-radius:30px;
font-weight:bold;
}
.hero{
background:#111;
color:white;
text-align:center;
padding:100px 20px;
}
.hero h1{
font-size:80px;
margin:0;
letter-spacing:10px;
}
.hero p{
font-size:18px;
letter-spacing:3px;
color:#bbb;
}
.shop{
max-width:1100px;
margin:auto;
padding:60px 20px;
}
h2{
text-align:center;
font-size:40px;
}
.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:25px;
}
.card{
background:white;
border-radius:15px;
overflow:hidden;
box-shadow:0 5px 20px #0001;
}
.card img{
width:100%;
height:480px;
object-fit:cover;
}
.info{
padding:22px;
}
.name{
font-size:24px;
font-weight:bold;
}
.price{
font-size:19px;
margin:10px 0 20px;
}
.add{
width:100%;
padding:15px;
background:#111;
color:white;
border:0;
border-radius:8px;
font-weight:bold;
}
.about{
background:#111;
color:white;
text-align:center;
padding:70px 20px;
}
.about p{
max-width:600px;
margin:auto;
line-height:1.7;
color:#bbb;
}
footer{
background:#111;
color:#777;
text-align:center;
padding:25px;
}
#cartBox{
display:none;
position:fixed;
right:0;
top:0;
height:100%;
width:360px;
max-width:100%;
background:white;
padding:25px;
z-index:50;
box-shadow:-5px 0 25px #0004;
}
.close{
float:right;
border:0;
border-radius:50%;
padding:10px;
}
.item{
border-bottom:1px solid #ddd;
padding:15px 0;
display:flex;
justify-content:space-between;
}
.remove{
border:0;
padding:7px;
}
.total{
font-size:22px;
font-weight:bold;
margin-top:25px;
}
.checkout{
width:100%;
padding:15px;
margin-top:20px;
background:#111;
color:white;
border:0;
border-radius:8px;
}
@media(max-width:700px){
.grid{grid-template-columns:1fr}
.hero h1{font-size:50px}
.card img{height:400px}
}
</style>
</head>
<body>
<header>
<div class="logo">ZUNYX</div>
<button class="cart" onclick="showCart()">
CART (<span id="number">0</span>)
</button>
</header>
<section class="hero">
<h1>ZUNYX</h1>
<p>MOVE DIFFERENT.</p>
</section>
<section class="shop">
<h2>SHOP ZUNYX</h2>
<div class="grid">
<div class="card">
<img src="product1.jpg" alt="ZUNYX Hoodie">
<div class="info">
<div class="name">ZUNYX HOODIE</div>
<div class="price">£34.99</div>
<button class="add"
onclick="addItem('ZUNYX Hoodie',34.99)">
ADD TO CART
</button>
</div>
</div>
<div class="card">
<img src="product2.jpg" alt="ZUNYX Performance">
<div class="info">
<div class="name">ZUNYX PERFORMANCE</div>
<div class="price">£55.00</div>
<button class="add"
onclick="addItem('ZUNYX Performance',55)">
ADD TO CART
</button>
</div>
</div>
</div>
</section>
<section class="about">
<h2>THE ZUNYX STANDARD</h2>
<p>
Built different. Designed for movement.
ZUNYX brings together sportswear and street style
for people who want to stand out.
</p>
</section>
<footer>
© 2026 ZUNYX
</footer>
<div id="cartBox">
<button class="close" onclick="hideCart()">×</button>
<h2>YOUR CART</h2>
<div id="list">
Your cart is empty.
</div>
<div class="total">
TOTAL £<span id="sum">0.00</span>
</div>
<button class="checkout" onclick="checkout()">
CHECKOUT
</button>
</div>
<script>
let basket=[];
function addItem(name,price){
basket.push({
name:name,
price:price
});
update();
showCart();
}
function update(){
document.getElementById("number").innerText=basket.length;
let list=document.getElementById("list");
let total=0;
list.innerHTML="";
if(basket.length===0){
list.innerHTML="Your cart is empty.";
}else{
basket.forEach(function(item,i){
total+=item.price;
list.innerHTML+=`
<div class="item">
<span>
<b>${item.name}</b><br>
£${item.price.toFixed(2)}
</span>
<button class="remove"
onclick="removeItem(${i})">
×
</button>
</div>
`;
});
}
document.getElementById("sum").innerText=total.toFixed(2);
}
function removeItem(i){
basket.splice(i,1);
update();
}
function showCart(){
document.getElementById("cartBox").style.display="block";
}
function hideCart(){
document.getElementById("cartBox").style.display="none";
}
function checkout(){
if(basket.length===0){
alert("Your cart is empty!");
}else{
alert("ZUNYX checkout coming soon!");
}
}
</script>
</body>
</html>
