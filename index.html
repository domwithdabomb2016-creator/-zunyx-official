<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ZUNYX — Move Different</title>
  <meta name="description" content="ZUNYX — premium sportswear built to move different.">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #050505;
      color: #fff;
      overflow-x: hidden;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* =========================
       HEADER
    ========================= */

    .announcement {
      background: #fff;
      color: #000;
      text-align: center;
      padding: 9px 15px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    header {
      position: fixed;
      top: 35px;
      left: 0;
      width: 100%;
      z-index: 1000;
      padding: 18px 5%;
      transition: 0.3s ease;
    }

    header.scrolled {
      top: 0;
      background: rgba(5, 5, 5, 0.92);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    .nav {
      max-width: 1400px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-size: 28px;
      font-weight: 1000;
      letter-spacing: -2px;
    }

    .logo span {
      color: #888;
    }

    .nav-links {
      display: flex;
      gap: 35px;
      list-style: none;
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .nav-links a {
      position: relative;
    }

    .nav-links a::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: -6px;
      width: 0;
      height: 1px;
      background: #fff;
      transition: 0.3s;
    }

    .nav-links a:hover::after {
      width: 100%;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .icon-btn {
      width: 42px;
      height: 42px;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 50%;
      background: rgba(255,255,255,0.05);
      color: #fff;
      display: grid;
      place-items: center;
      transition: 0.3s;
    }

    .icon-btn:hover {
      background: #fff;
      color: #000;
    }

    .cart-button {
      position: relative;
    }

    .cart-count {
      position: absolute;
      right: -3px;
      top: -3px;
      min-width: 18px;
      height: 18px;
      padding: 0 4px;
      border-radius: 50px;
      background: #fff;
      color: #000;
      display: grid;
      place-items: center;
      font-size: 10px;
      font-weight: 900;
    }

    .menu-btn {
      display: none;
    }

    /* =========================
       HERO
    ========================= */

    .hero {
      min-height: 100vh;
      position: relative;
      display: flex;
      align-items: flex-end;
      padding: 160px 5% 70px;
      overflow: hidden;
      background:
        radial-gradient(circle at 70% 40%, #222 0%, #090909 40%, #050505 75%);
    }

    .hero::before {
      content: "ZUNYX";
      position: absolute;
      right: -70px;
      top: 30%;
      font-size: clamp(130px, 22vw, 360px);
      line-height: 0.8;
      font-weight: 1000;
      color: rgba(255,255,255,0.025);
      pointer-events: none;
    }

    .hero-content {
      max-width: 1400px;
      width: 100%;
      margin: auto;
      position: relative;
      z-index: 2;
    }

    .eyebrow {
      display: inline-block;
      margin-bottom: 20px;
      padding: 8px 12px;
      border: 1px solid rgba(255,255,255,0.2);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .hero h1 {
      max-width: 900px;
      font-size: clamp(60px, 10vw, 145px);
      line-height: 0.82;
      letter-spacing: -7px;
      font-weight: 1000;
      text-transform: uppercase;
    }

    .hero h1 span {
      color: transparent;
      -webkit-text-stroke: 1px #fff;
    }

    .hero-description {
      max-width: 470px;
      margin-top: 30px;
      color: #aaa;
      line-height: 1.7;
      font-size: 14px;
    }

    .hero-buttons {
      display: flex;
      gap: 12px;
      margin-top: 30px;
      flex-wrap: wrap;
    }

    .primary-btn,
    .secondary-btn {
      padding: 15px 24px;
      border: none;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      transition: 0.3s;
    }

    .primary-btn {
      background: #fff;
      color: #000;
    }

    .primary-btn:hover {
      transform: translateY(-3px);
      background: #ddd;
    }
